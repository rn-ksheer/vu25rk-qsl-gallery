<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Worldwide QSL Gallery</title>

    <meta name="description"
        content="Worldwide QSL Gallery - Received from Amateur Radio Friends Around the World">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="site-header">

        <h1>🌍 Worldwide QSL Gallery</h1>

        <p>
            Received by VU25RadioKilo (OLD-VU3CQM) from Amateur Radio Friends Around the World
        </p>

    </header>

    <!-- ================ MAIN ================= -->

    <main>

        <!-- Gallery will be created here automatically -->
        <div id="galleryContainer"></div>

    </main>

    <!-- =============== IMAGE VIEWER =============== -->

    <div id="lightbox" class="hidden" aria-hidden="true">

        <!-- Dark Background -->
        <div id="overlay"></div>

        <!-- Close -->
        <button id="closeBtn" title="Close" aria-label="Close image viewer">&times;</button>

        <!-- Previous -->
        <button id="prevBtn" title="Previous" aria-label="Previous QSL">&#10094;</button>

        <!-- Image -->

        <div class="lightbox-content">
            <div class="image-stage" id="imageStage">
                <div class="image-loader" id="imageLoader" role="status" aria-label="Loading image"></div>
                <img id="lightboxImage"
                     src=""
                     alt="QSL Card"
                     draggable="false">
            </div>
            <div id="imageCaption"></div>
        </div>

        <!-- Next -->
        <button id="nextBtn" title="Next" aria-label="Next QSL">&#10095;</button>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>73 de VU25RadioKilo (OLD-VU3CQM)</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
